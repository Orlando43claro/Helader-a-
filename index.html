<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladería Delicias</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <div class="header-container">
            <img src="https://i.ibb.co/mmdP2Pb/Ice-Cream-dessert-02.jpg" alt="Icono de helado" class="icono">
            <h3><span>Delicias</span></h3>
            <nav class="carrito-container">
                <img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png" alt="Carrito de compras" class="carrito" aria-label="Carrito de compras">
                <span id="carrito-count">0</span>
            </nav>
        </div>
    </header>

    <main>
        <section class="scroll">
            <h2 class="section-title">Galería de Helados</h2>
            <div class="scroll-container">
                <article class="scroll-item producto" data-name="Helado Mixto" data-price="7000">
                    <img src="https://i.ibb.co/tMTWkZRK/helados.webp" alt="Helado Mixto" loading="lazy">
                    <p>Helado Mixto - $7.000</p>
                    <button class="agregar-carrito">Añadir al carrito</button>
                </article>
                <article class="scroll-item producto" data-name="Helado Tropical" data-price="8500">
                    <img src="https://i.ibb.co/p6pYG6Vq/helados-en-republica-dominicana.jpg" alt="Helado Tropical" loading="lazy">
                    <p>Helado Tropical - $8.500</p>
                    <button class="agregar-carrito">Añadir al carrito</button>
                </article>
                <article class="scroll-item producto" data-name="Helado Crema" data-price="6000">
                    <img src="https://i.ibb.co/2GRW9hB/images.jpg" alt="Helado Crema" loading="lazy">
                    <p>Helado Crema - $6.000</p>
                    <button class="agregar-carrito">Añadir al carrito</button>
                </article>
                <article class="scroll-item producto" data-name="Helado Especial" data-price="9000">
                    <img src="https://i.ibb.co/xKpYZQWL/16267631076813.jpg" alt="Helado Especial" loading="lazy">
                    <p>Helado Especial - $9.000</p>
                    <button class="agregar-carrito">Añadir al carrito</button>
                </article>
            </div>
        </section>

        <section class="menu">
            <h2 class="section-title">Menú de Helados</h2>
            <ul>
                <li class="menu-item producto" data-name="Helado Vainilla" data-price="5000">
                    <article>
                        <img src="https://i.ibb.co/5gLTkYVL/helado.jpg" alt="Helado Vainilla" loading="lazy">
                        <div class="menu-item-info">
                            <p class="menu-item-name">Helado Vainilla</p>
                            <p class="menu-item-price">$5.000</p>
                        </div>
                        <button class="agregar-carrito">Añadir al carrito</button>
                    </article>
                </li>
                <li class="menu-item producto" data-name="Helado Fresa" data-price="6000">
                    <article>
                        <img src="https://i.ibb.co/JwLvcPfZ/copa-de-helado-linea-canada.jpg" alt="Helado Fresa" loading="lazy">
                        <div class="menu-item-info">
                            <p class="menu-item-name">Helado Fresa</p>
                            <p class="menu-item-price">$6.000</p>
                        </div>
                        <button class="agregar-carrito">Añadir al carrito</button>
                    </article>
                </li>
                <li class="menu-item producto" data-name="Copa Helada" data-price="8000">
                    <article>
                        <img src="https://i.ibb.co/jZ1YkKjq/descarga.jpg" alt="Copa Helada" loading="lazy">
                        <div class="menu-item-info">
                            <p class="menu-item-name">Copa Helada</p>
                            <p class="menu-item-price">$8.000</p>
                        </div>
                        <button class="agregar-carrito">Añadir al carrito</button>
                    </article>
                </li>
            </ul>
        </section>
    </main>

    <div id="carrito-modal" class="modal">
        <div class="modal-content">
            <span class="close">×</span>
            <h2>Carrito de Compras</h2>
            <ul id="carrito-items">
            </ul>
            <h3>Detalles de Entrega</h3>
            <form id="direccion-form">
                <label for="nombre-cliente">Nombre del Cliente:</label>
                <input type="text" id="nombre-cliente" required>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" required>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" required>
            </form>
            <button id="comprar-whatsapp">Comprar por WhatsApp</button>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
