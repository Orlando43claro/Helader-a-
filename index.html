<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heladería Delicias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>Heladería Delicias</h1>
  </header>

  <!-- Carrusel -->
  <section class="carousel">
    <h2>Carrusel de Helados</h2>
    <div class="carousel-container">
      <img src="1.jpg" alt="Imagen 1">
      <img src="2.jpg" alt="Imagen 2">
      <img src="3.jpeg" alt="Imagen 3">
      <img src="4.jpg" alt="Imagen 4">
      <img src="5.jpg" alt="Imagen 5">
    </div>
  </section>

 <!-- Menú de Helados -->
<section class="menu">
  <h2>Menú de Helados</h2>
  <div class="menu-container">
    <!-- Primera fila -->
    <div class="menu-row">
      <div class="menu-item">
        <img src="1.jpg" alt="Helado Uno">
        <p>Helado Uno</p>
        <p>$5.000</p>
        <button onclick="addToCart('Helado Uno', 5000)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="4.jpg" alt="Helado Cuatro">
        <p>Helado Cuatro</p>
        <p>$6.000</p>
        <button onclick="addToCart('Helado Cuatro', 6000)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="7.jpg" alt="Helado Siete">
        <p>Helado Siete</p>
        <p>$7.000</p>
        <button onclick="addToCart('Helado Siete', 7000)">Añadir al Carrito</button>
      </div>
    </div>

    <!-- Segunda fila -->
    <div class="menu-row">
      <div class="menu-item">
        <img src="2.jpg" alt="Helado Dos">
        <p>Helado Dos</p>
        <p>$5.500</p>
        <button onclick="addToCart('Helado Dos', 5500)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="5.jpg" alt="Helado Cinco">
        <p>Helado Cinco</p>
        <p>$6.500</p>
        <button onclick="addToCart('Helado Cinco', 6500)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="8.jpg" alt="Helado Ocho">
        <p>Helado Ocho</p>
        <p>$7.500</p>
        <button onclick="addToCart('Helado Ocho', 7500)">Añadir al Carrito</button>
      </div>
    </div>

    <!-- Tercera fila -->
    <div class="menu-row">
      <div class="menu-item">
        <img src="3.jpg" alt="Helado Tres">
        <p>Helado Tres</p>
        <p>$6.000</p>
        <button onclick="addToCart('Helado Tres', 6000)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="6.jpg" alt="Helado Seis">
        <p>Helado Seis</p>
        <p>$7.000</p>
        <button onclick="addToCart('Helado Seis', 7000)">Añadir al Carrito</button>
      </div>
      <div class="menu-item">
        <img src="9.jpg" alt="Helado Nueve">
        <p>Helado Nueve</p>
        <p>$8.000</p>
        <button onclick="addToCart('Helado Nueve', 8000)">Añadir al Carrito</button>
      </div>
    </div>
  </div>
</section>

  <script src="script.js"></script>
</body>
</html>
