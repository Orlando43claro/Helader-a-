<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heladería Delicias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>Heladería Delicias</h1>
  </header>

  <!-- Carrusel -->
  <section class="carousel">
    <h2>Carrusel de Helados</h2>
    <div class="carousel-container">
      <img src="1.jpg" alt="Imagen 1">
      <img src="2.jpg" alt="Imagen 2">
      <img src="3.jpeg" alt="Imagen 3">
      <img src="4.jpg" alt="Imagen 4">
      <img src="5.jpg" alt="Imagen 5">
    </div>
  </section>

  <!-- Menú de Helados -->
  <section class="menu">
    <h2>Menú de Helados</h2>
    <div class="menu-container">
      <!-- Tres imágenes verticales -->
      <div class="menu-vertical">
        <div class="menu-item">
          <img src="6.jpg" alt="Helado de Fresa">
          <p>Helado de Fresa</p>
          <p>$5.000</p>
          <button onclick="addToCart('Helado de Fresa', 5000)">Añadir al Carrito</button>
        </div>
        <div class="menu-item">
          <img src="7.jpg" alt="Helado de Chocolate">
          <p>Helado de Chocolate</p>
          <p>$6.000</p>
          <button onclick="addToCart('Helado de Chocolate', 6000)">Añadir al Carrito</button>
        </div>
        <div class="menu-item">
          <img src="8.jpeg" alt="Helado Tropical">
          <p>Helado Tropical</p>
          <p>$7.000</p>
          <button onclick="addToCart('Helado Tropical', 7000)">Añadir al Carrito</button>
        </div>
      </div>

      <!-- Tres imágenes horizontales con scroll -->
      <div class="menu-horizontal">
        <div class="menu-item">
          <img src="9.jpeg" alt="Copa Helada">
          <p>Copa Helada</p>
          <p>$8.000</p>
          <button onclick="addToCart('Copa Helada', 8000)">Añadir al Carrito</button>
        </div>
        <div class="menu-item">
          <img src="10.jpeg" alt="Helado Mixto">
          <p>Helado Mixto</p>
          <p>$7.500</p>
          <button onclick="addToCart('Helado Mixto', 7500)">Añadir al Carrito</button>
        </div>
        <div class="menu-item">
          <img src="11.jpeg" alt="Helado Especial">
          <p>Helado Especial</p>
          <p>$9.000</p>
          <button onclick="addToCart('Helado Especial', 9000)">Añadir al Carrito</button>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
