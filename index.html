<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heladería Delicias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>Heladería Delicias</h1>
  </header>

  <!-- Carrusel -->
  <section class="carousel">
    <h2>Carrusel de Helados</h2>
    <div class="carousel-container">
      <img src="1.jpg" alt="Imagen 1">
      <img src="2.jpg" alt="Imagen 2">
      <img src="3.jpg" alt="Imagen 3">
      <img src="4.jpg" alt="Imagen 4">
      <img src="5.jpg" alt="Imagen 5">
    </div>
  </section>

  <!-- Menú de Helados -->
  <section class="menu">
    <h2>Menú de Helados</h2>
    <div class="menu-container">
      <!-- Tres imágenes verticales -->
      <div class="menu-vertical">
        <img src="6.jpg" alt="Helado 6">
        <img src="7.jpg" alt="Helado 7">
        <img src="8.jpeg" alt="Helado 8">
      </div>

      <!-- Tres imágenes horizontales con scroll -->
      <div class="menu-horizontal">
        <img src="9.jpeg" alt="Helado 9">
        <img src="10.jpeg" alt="Helado 10">
        <img src="11.jpeg" alt="Helado 11">
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
